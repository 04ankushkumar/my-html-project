<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Print String, Value,and boolean</title>
</head>
<body>
    <script>
        let input=prompt ("Enter a value:");
        let number=Number(input);
        let string=String(input);
        let boolean=Boolean(input);
        console.log("As number.",number);
        console.log("As string:",string);
        console.log("As boolean:",boolean);
    </script>
</body>
</html>
