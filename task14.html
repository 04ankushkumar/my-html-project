<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sumof positive</title>
</head>
<body>
    <script>
        let nums=[1,-5,0,23,-18,0,7,-2,15];
        let positivesum=0;
        let negativesum=0;
        let zerocount=0;
        for(let i=0;i<nums.length;i++){
            if(nums[i]>0){
                positivesum+=nums[i];
            }
            else if(nums[i]<0){
                negativesum+=nums[i];
            }else{
                zerocount++;
            }
        }
        console.log("Sum of positive number:",positivesum);
        console.log("sum of negarive numbers:",negativesum);
        console.log("count of zeroes:",zerocount);
    </script>
</body>
</html>
