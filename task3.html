<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pallindrome Number</title>
</head>
<body>
    <script>
        let n=12321;
        let original=n;
        let reverse=0;
        while(n>0){
            let digit=n%10;
            reverse=reverse*10+digit;
            n=Math.floor(n/10);
        }
        if(original==reverse){
            document.write("12321 is a pallindrome number:");
        }else{
            document.write("12321 is not  a pallindrome number:");
        }
    </script>
</body>
</html>
